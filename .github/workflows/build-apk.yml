name: Build APK - Jejum e Apoio

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Restore and verify full source
        run: |
          rm -f full_source.b64
          for i in $(seq -w 0 25); do
            case "$i" in
              09) cat full_source_fixes/part09a.b64 full_source_fixes/part09b.b64 ;;
              14) cat full_source_fixes/part14a.b64 full_source_fixes/part14b.b64 ;;
              15) cat full_source_fixes/part15a.b64 full_source_fixes/part15b.b64 ;;
              *)  cat "full_source_parts_safe/part${i}.b64" ;;
            esac
          done > full_source.b64
          test "$(wc -c < full_source.b64)" -eq 178192
          base64 -d full_source.b64 > full_source.zip
          echo "1ca1c5fdd524a9fba669cb50f90d7b59f03df26d0fa0d51f6872a54b7d73dac1  full_source.zip" | sha256sum -c -
          unzip -t full_source.zip
          unzip -q full_source.zip -d full-app
          test -f full-app/src/components/RecipeManager.tsx
          test -f full-app/src/components/PhysicalActivityTracker.tsx
          test -f full-app/src/components/PantryAndDiet.tsx
          test -f full-app/src/components/MedicationTracker.tsx
          test -f full-app/src/components/WaterTracker.tsx
          test -f full-app/src/components/FastingTracker.tsx
          test -f full-app/src/components/BmiAndWeight.tsx
          test -f full-app/src/components/DailyProgress.tsx
          test -f full-app/src/components/SupportHub.tsx
          grep -q "Receitas" full-app/src/components/Sidebar.tsx
          grep -q "Atividades" full-app/src/components/Sidebar.tsx
          grep -q "Dieta" full-app/src/components/Sidebar.tsx
          grep -q "Remédios" full-app/src/components/Sidebar.tsx

      - name: Apply secure Groq backend
        run: |
          python patches/apply_groq_secure.py full-app
          test -f full-app/src/services/groq.ts
          test ! -f full-app/src/services/gemini.ts
          grep -q "GROQ_API_KEY" full-app/server.ts
          grep -q "/api/ai/chat" full-app/server.ts
          ! grep -R "Entrar com Google\|Google Web Client ID\|Gemini conectado" -n full-app/src

      - name: Apply chat black-screen stability fix
        run: |
          cat chat_black_fix/part*.b64 > chat_black_fix.b64
          base64 -d chat_black_fix.b64 > chat_black_fix.zip
          echo "2f55ad55c18860eb835148dfcc09e7bf562a516b435156de3bbfafdbcd2cd942  chat_black_fix.zip" | sha256sum -c -
          unzip -t chat_black_fix.zip
          unzip -oq chat_black_fix.zip -d full-app
          test -f full-app/src/components/AppErrorBoundary.tsx
          grep -q "AppErrorBoundary" full-app/src/main.tsx
          grep -q "fetchWithTimeout" full-app/src/services/groq.ts
          grep -q "chatScrollRef" full-app/src/components/SupportHub.tsx
          grep -q "Tempo limite da Groq excedido" full-app/server.ts

      - name: Fix Android safe area
        run: |
          python - <<'PY'
          from pathlib import Path
          sidebar = Path('full-app/src/components/Sidebar.tsx')
          s = sidebar.read_text(encoding='utf-8')
          old = 'className="md:hidden sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between"'
          new = 'className="md:hidden sticky top-0 z-40 bg-slate-950/95 backdrop-blur-md border-b border-slate-800/80 px-4 pb-3 flex items-center justify-between" style={{ paddingTop: "max(calc(env(safe-area-inset-top, 0px) + 0.75rem), 2.5rem)" }}'
          if old in s:
              s = s.replace(old, new)
          elif 'safe-area-inset-top' not in s:
              raise SystemExit('Cabeçalho móvel esperado não encontrado')
          sidebar.write_text(s, encoding='utf-8')
          html = Path('full-app/index.html')
          h = html.read_text(encoding='utf-8')
          if 'viewport-fit=cover' not in h:
              h = h.replace('user-scalable=no', 'user-scalable=no, viewport-fit=cover')
          html.write_text(h, encoding='utf-8')
          PY

      - name: Package Groq project for Windows server
        run: |
          cd full-app
          zip -qr ../Jejum-e-Apoio-PROJETO-GROQ.zip . -x 'node_modules/*' 'android/*' 'dist/*' '.data/*' '.env'
          cd ..
          test -f Jejum-e-Apoio-PROJETO-GROQ.zip

      - name: Install dependencies
        working-directory: full-app
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: full-app
        run: npm run lint

      - name: Build full web app
        working-directory: full-app
        run: npm run build:web

      - name: Create Android project
        working-directory: full-app
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: full-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Signing report
        working-directory: full-app/android
        run: |
          ./gradlew signingReport > ../android-signing-report.txt
          grep -E "Variant:|SHA1:|SHA-256:" ../android-signing-report.txt || true

      - name: Verify Groq APK
        run: |
          test -f full-app/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum full-app/android/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          cp full-app/android/app/build/outputs/apk/debug/app-debug.apk Jejum-e-Apoio-GROQ-CORRIGIDO.apk

      - name: Upload APK and server project
        uses: actions/upload-artifact@v4
        with:
          name: Jejum-e-Apoio-GROQ-CORRIGIDO
          path: |
            Jejum-e-Apoio-GROQ-CORRIGIDO.apk
            Jejum-e-Apoio-PROJETO-GROQ.zip
            full-app/android-signing-report.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
