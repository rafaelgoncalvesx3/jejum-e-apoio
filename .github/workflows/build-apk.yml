name: Build APK - Jejum e Apoio

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir -p appsrc
          base64 -d Jejum_e_Apoio_SOURCE.zip > source.zip
          unzip -q source.zip -d appsrc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: appsrc
        run: npm install --no-audit --no-fund

      - name: Build web
        working-directory: appsrc
        run: npm run build:web

      - name: Add Android platform
        working-directory: appsrc
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Capture debug signing SHA-1
        working-directory: appsrc/android
        run: |
          chmod +x gradlew
          ./gradlew signingReport > ../android-signing-report.txt
          cat ../android-signing-report.txt

      - name: Build debug APK
        working-directory: appsrc/android
        run: ./gradlew assembleDebug

      - name: Create APK checksum
        run: sha256sum appsrc/android/app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jejum-e-Apoio-TESTE
          path: |
            appsrc/android/app/build/outputs/apk/debug/app-debug.apk
            appsrc/android-signing-report.txt
            apk-sha256.txt
          if-no-files-found: error
