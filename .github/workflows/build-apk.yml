name: Build APK - Jejum e Apoio

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify source
        run: |
          cat source_parts/part00.b64 source_parts/part01.b64 source_parts/part02.b64 source_parts/part03.b64 > source.b64
          base64 -d source.b64 > source.zip
          echo "29d205f34e259ae7fc054dd6c133af96b048385fcc256f8bfc60df1295fc6173  source.zip" | sha256sum -c -
          unzip -tq source.zip
          mkdir -p appsrc
          unzip -q source.zip -d appsrc
          test -f appsrc/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: appsrc
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        working-directory: appsrc
        run: npm run lint

      - name: Build web
        working-directory: appsrc
        run: npm run build:web

      - name: Add Android platform
        working-directory: appsrc
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Capture debug signing SHA-1
        working-directory: appsrc/android
        run: |
          chmod +x gradlew
          ./gradlew signingReport > ../android-signing-report.txt
          cat ../android-signing-report.txt

      - name: Build debug APK
        working-directory: appsrc/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Create APK checksum
        run: sha256sum appsrc/android/app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jejum-e-Apoio-TESTE
          path: |
            appsrc/android/app/build/outputs/apk/debug/app-debug.apk
            appsrc/android-signing-report.txt
            apk-sha256.txt
          if-no-files-found: error
