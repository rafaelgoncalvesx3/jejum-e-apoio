name: Build APK - Jejum e Apoio

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: apk-demo
        run: npm install --no-audit --no-fund

      - name: Validate web assets
        working-directory: apk-demo
        run: |
          node --check www/storage.js
          node --check www/support.js
          node --check www/app.js
          test -f www/index.html

      - name: Create Android project
        working-directory: apk-demo
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Signing report
        working-directory: apk-demo/android
        run: |
          chmod +x gradlew
          ./gradlew signingReport > ../android-signing-report.txt
          grep -E "Variant:|SHA1:|SHA-256:" ../android-signing-report.txt || true

      - name: Build debug APK
        working-directory: apk-demo/android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f apk-demo/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum apk-demo/android/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          cp apk-demo/android/app/build/outputs/apk/debug/app-debug.apk Jejum-e-Apoio-TESTE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jejum-e-Apoio-TESTE
          path: |
            Jejum-e-Apoio-TESTE.apk
            apk-demo/android-signing-report.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
