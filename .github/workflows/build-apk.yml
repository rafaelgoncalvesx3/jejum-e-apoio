name: Build APK - Jejum e Apoio

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Restore full source
        run: |
          cat full_source_parts/part*.b64 > full_source.b64
          base64 -d full_source.b64 > full_source.zip
          echo "29d205f34e259ae7fc054dd6c133af96b048385fcc256f8bfc60df1295fc6173  full_source.zip" | sha256sum -c -
          unzip -q full_source.zip -d full-app
          test -f full-app/src/components/RecipeManager.tsx
          test -f full-app/src/components/PhysicalActivityTracker.tsx
          test -f full-app/src/components/PantryAndDiet.tsx
          test -f full-app/src/components/SupportHub.tsx

      - name: Install dependencies
        working-directory: full-app
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: full-app
        run: npm run lint

      - name: Build full web app
        working-directory: full-app
        run: npm run build:web

      - name: Create Android project
        working-directory: full-app
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: full-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Signing report
        working-directory: full-app/android
        run: |
          ./gradlew signingReport > ../android-signing-report.txt
          grep -E "Variant:|SHA1:|SHA-256:" ../android-signing-report.txt || true

      - name: Verify full APK
        run: |
          test -f full-app/android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum full-app/android/app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
          cp full-app/android/app/build/outputs/apk/debug/app-debug.apk Jejum-e-Apoio-COMPLETO.apk

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: Jejum-e-Apoio-COMPLETO
          path: |
            Jejum-e-Apoio-COMPLETO.apk
            full-app/android-signing-report.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
